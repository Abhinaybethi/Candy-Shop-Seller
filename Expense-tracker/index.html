<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Navigation / Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
                <i class="bi bi-wallet2 fs-4"></i> Expense Tracker
            </span>
            <span class="badge bg-light text-primary fs-6 px-3 py-2 rounded-pill shadow-sm">
                Total Spent: <span id="navTotalAmount">$0.00</span>
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            
            <!-- Add Expense Form Column -->
            <div class="col-lg-4 col-md-5">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="card-title mb-0 text-primary fw-bold">
                            <i class="bi bi-plus-circle me-1"></i> Add New Expense
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="expenseForm">
                            <!-- Expense Name -->
                            <div class="mb-3">
                                <label for="expenseName" class="form-label fw-semibold">Expense Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-tag"></i></span>
                                    <input type="text" class="form-control" id="expenseName" placeholder="e.g. Grocery Shopping" required>
                                </div>
                            </div>

                            <!-- Amount -->
                            <div class="mb-3">
                                <label for="expenseAmount" class="form-label fw-semibold">Amount ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-currency-dollar"></i></span>
                                    <input type="number" step="0.01" min="0.01" class="form-control" id="expenseAmount" placeholder="0.00" required>
                                </div>
                            </div>

                            <!-- Category -->
                            <div class="mb-3">
                                <label for="expenseCategory" class="form-label fw-semibold">Category</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-grid"></i></span>
                                    <select class="form-select" id="expenseCategory" required>
                                        <option value="Food & Dining" selected>🍔 Food & Dining</option>
                                        <option value="Transportation">🚗 Transportation</option>
                                        <option value="Shopping">🛍️ Shopping</option>
                                        <option value="Utilities & Bills">💡 Utilities & Bills</option>
                                        <option value="Entertainment">🎬 Entertainment</option>
                                        <option value="Health">💊 Health</option>
                                        <option value="Other">📦 Other</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Date -->
                            <div class="mb-4">
                                <label for="expenseDate" class="form-label fw-semibold">Date</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-calendar3"></i></span>
                                    <input type="date" class="form-control" id="expenseDate" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                                <i class="bi bi-plus-lg me-1"></i> Add Expense
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Expense List and Table Column -->
            <div class="col-lg-8 col-md-7">
                
                <!-- Quick Metrics Row -->
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <div class="card border-0 shadow-sm bg-primary text-white p-3 rounded-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <small class="text-white-50 text-uppercase fw-semibold">Total Expenses</small>
                                    <h3 class="mb-0 fw-bold" id="totalAmount">$0.00</h3>
                                </div>
                                <div class="bg-white bg-opacity-25 rounded-circle p-3">
                                    <i class="bi bi-cash-stack fs-3"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="card border-0 shadow-sm bg-white p-3 rounded-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <small class="text-muted text-uppercase fw-semibold">Total Records</small>
                                    <h3 class="mb-0 fw-bold text-dark" id="expenseCount">0</h3>
                                </div>
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3">
                                    <i class="bi bi-receipt fs-3"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Expense Table Card -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold text-secondary">
                            <i class="bi bi-clock-history me-1"></i> Expense History
                        </h5>
                        <button id="clearAllBtn" class="btn btn-outline-danger btn-sm" style="display: none;">
                            <i class="bi bi-trash3 me-1"></i> Clear All
                        </button>
                    </div>

                    <div class="card-body p-0">
                        <!-- Table Responsive Wrapper -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="expenseTable">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="ps-4">Expense</th>
                                        <th scope="col">Category</th>
                                        <th scope="col">Date</th>
                                        <th scope="col" class="text-end">Amount</th>
                                        <th scope="col" class="text-center pe-4" style="width: 100px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="expenseList">
                                    <!-- Dynamic Rows Rendered by script.js -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Empty State Notification -->
                        <div id="emptyState" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary opacity-50"></i>
                            <h6 class="fw-semibold">No expenses recorded yet</h6>
                            <p class="small text-muted mb-0">Use the form on the left to track your first expense.</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application Logic -->
    <script src="script.js"></script>
</body>

</html>
